# Full queuetask + queue-ti stack.
#
# Prerequisites:
#   - Docker Desktop (or Docker Engine) running
#
# Usage:
#   docker compose up --build
#
# Endpoints after startup:
#   queuetask UI & API  →  http://localhost:8081
#   queue-ti admin API  →  http://localhost:8080
#   queue-ti gRPC       →  localhost:50051
#
# queue-ti credentials: admin / secret
#
# Two workflows are loaded automatically:
#
#   demo             — manual + auto steps only, fully controllable from the UI.
#
#     1. Start an instance:
#          curl -X POST http://localhost:8081/api/v1/workflows/demo/instances
#     2. Open http://localhost:8081, click the instance, then click Trigger on
#        each waiting step. The auto steps complete on their own.
#
#   order-processing — full integration demo (manual + auto + queue-ti trigger).
#
#     1. Start an instance:
#          curl -X POST http://localhost:8081/api/v1/workflows/order-processing/instances
#     2. Trigger the first step via the UI.
#     3. Advance the queueti step by publishing to the fulfillment-results topic:
#          TOKEN=$(curl -s -X POST http://localhost:8080/api/auth/login \
#            -H 'Content-Type: application/json' \
#            -d '{"username":"admin","password":"secret"}' | grep -o '"token":"[^"]*' | cut -d'"' -f4)
#          curl -X POST http://localhost:8080/api/messages \
#            -H "Authorization: Bearer $TOKEN" \
#            -H 'Content-Type: application/json' \
#            -d '{"topic":"fulfillment-results","payload":{"status":"fulfilled"}}'

services:

  # ── Shared database ────────────────────────────────────────────────────────
  # queue-ti uses the 'public' schema; queuetask uses its own 'queuetask' schema.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: queueti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── queue-ti message broker ────────────────────────────────────────────────
  queueti:
    image: ghcr.io/joessst-dev/queue-ti:latest
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8080:8080"
    environment:
      QUEUETI_DB_HOST: postgres
      QUEUETI_DB_PORT: "5432"
      QUEUETI_DB_USER: postgres
      QUEUETI_DB_PASSWORD: postgres
      QUEUETI_DB_NAME: queueti
      QUEUETI_DB_SSLMODE: disable
      QUEUETI_SERVER_PORT: "50051"
      QUEUETI_SERVER_HTTP_PORT: "8080"
      QUEUETI_AUTH_ENABLED: "true"
      QUEUETI_AUTH_USERNAME: admin
      QUEUETI_AUTH_PASSWORD: secret
      # Change this to a long random string in any non-local environment.
      QUEUETI_AUTH_JWT_SECRET: "change-me-in-production-use-a-long-random-string"
      QUEUETI_LOG_LEVEL: info
      # Disable mandatory topic pre-registration so the example workflow works
      # without extra setup steps.
      QUEUETI_QUEUE_REQUIRE_TOPIC_REGISTRATION: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── queuetask workflow engine ──────────────────────────────────────────────
  # Build context is the parent directory so the Dockerfile can reach the
  # queue-ti sibling (required by go.mod replace directives).
  queuetask:
    build:
      context: ..
      dockerfile: queuetask/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # Override the embedded config.yaml with compose-specific settings.
      - ./docker/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      queueti:
        condition: service_healthy

volumes:
  pgdata:
