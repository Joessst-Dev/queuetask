# queuetask configuration for docker-compose.
# Mounted into the container at /app/config.yaml by docker-compose.yaml.
server:
  port: 8081

db:
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  name: queueti
  sslmode: disable

workflows:
  dir: ./workflows

queueti:
  enabled: true
  grpc_addr: "queueti:50051"
  admin_url: "http://queueti:8080"
  username: admin
  password: secret
