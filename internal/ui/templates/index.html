<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>queuetask</title>
  <link rel="stylesheet" href="/ui/static/tailwind.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    .htmx-request.btn-trigger, .htmx-request .btn-trigger { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans antialiased">

  <header class="flex items-center gap-2.5 px-5 py-3 bg-slate-900 border-b border-slate-800 shrink-0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <h1 class="text-sm font-semibold tracking-widest">queuetask</h1>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <aside class="w-72 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col overflow-hidden">

      <div class="px-4 py-2.5 text-xs font-bold uppercase tracking-widest text-slate-500 border-b border-slate-800 shrink-0 flex items-center justify-between">
        <span>Workflows</span>
        <button class="text-slate-500 hover:text-slate-300 transition-colors"
                title="Reload workflows from disk"
                hx-post="/api/v1/workflows/reload"
                hx-on::after-request="htmx.trigger('#workflows-list', 'reload')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
        </button>
      </div>
      <div id="workflows-list"
           class="shrink-0 overflow-y-auto border-b border-slate-800"
           style="max-height:40%"
           hx-get="/ui/workflows"
           hx-trigger="load, reload"
           hx-target="#workflows-list"
           hx-swap="innerHTML">
      </div>

      <div class="px-4 py-2.5 text-xs font-bold uppercase tracking-widest text-slate-500 border-b border-slate-800 shrink-0">
        Instances
      </div>
      <div id="instances-list"
           class="overflow-y-auto flex-1"
           hx-get="/ui/instances"
           hx-trigger="load, every 5s, refreshInstances from:body"
           hx-target="#instances-list"
           hx-swap="innerHTML">
      </div>

    </aside>

    <main id="detail" class="flex-1 overflow-y-auto p-6">
      <p class="text-slate-500 text-sm">&#8592; Select an instance to view its steps.</p>
    </main>

  </div>
</body>
</html>
