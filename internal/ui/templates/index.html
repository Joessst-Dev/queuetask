<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>queuetask</title>
  <link rel="stylesheet" href="/ui/static/tailwind.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
    function runMermaid() {
      if (document.querySelector('.mermaid:not([data-processed])')) {
        mermaid.run().catch(function(err) { console.error('mermaid render failed', err); });
      }
    }
    document.addEventListener('htmx:afterSettle', runMermaid);
    // Catch-up render for charts loaded before this module resolved.
    runMermaid();
  </script>
  <style>
    .htmx-request.btn-trigger, .htmx-request .btn-trigger { opacity: 0.4; pointer-events: none; }
    .mermaid:not([data-processed]) { opacity: 0; }
    .mermaid[data-processed] { opacity: 1; transition: opacity 0.15s ease-in; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans antialiased">

  <header class="flex items-center gap-2.5 px-5 py-3 bg-slate-900 border-b border-slate-800 shrink-0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <h1 class="text-sm font-semibold tracking-widest">queuetask</h1>
    <nav class="ml-auto flex items-center gap-4">
      <button class="text-xs font-medium text-slate-500 hover:text-slate-300 transition-colors cursor-pointer border-0 bg-transparent p-0"
              hx-get="/ui/runs"
              hx-target="#detail"
              hx-swap="innerHTML">
        Runs
      </button>
      <button class="text-xs font-medium text-slate-500 hover:text-slate-300 transition-colors cursor-pointer border-0 bg-transparent p-0"
              hx-get="/ui/builder"
              hx-target="#detail"
              hx-swap="innerHTML">
        Builder
      </button>
    </nav>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <aside class="w-72 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col overflow-hidden">

      <div class="px-4 py-2.5 text-xs font-bold uppercase tracking-widest text-slate-500 border-b border-slate-800 shrink-0 flex items-center justify-between">
        <span>Workflows</span>
        <button class="p-1 rounded text-slate-600 hover:text-slate-400 hover:bg-slate-800 transition-colors cursor-pointer border-0 bg-transparent"
                title="Reload workflows from disk"
                hx-post="/api/v1/workflows/reload"
                hx-swap="none"
                hx-on::after-request="htmx.trigger('#workflows-list', 'reload')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
        </button>
      </div>
      <div id="workflows-list"
           class="shrink-0 overflow-y-auto border-b border-slate-800"
           style="max-height:40%"
           hx-get="/ui/workflows"
           hx-trigger="load, reload, workflowSaved from:body"
           hx-target="#workflows-list"
           hx-swap="innerHTML">
      </div>

      <div class="px-4 py-2.5 text-xs font-bold uppercase tracking-widest text-slate-500 border-b border-slate-800 shrink-0">
        Instances
      </div>
      <div id="instances-filter" class="px-3 py-3 border-b border-slate-800 shrink-0">
        <input type="hidden" id="if-status" name="status" value="">
        <div class="grid grid-cols-2 gap-1.5">
          <button type="button" data-if-chip="pending"
                  data-if-active="bg-slate-700 text-slate-200 border-slate-500"
                  data-if-inactive="bg-transparent text-slate-500 border-slate-700"
                  onclick="toggleIfStatus('pending')"
                  class="if-chip py-1.5 rounded-md text-xs font-medium cursor-pointer border border-slate-700 bg-transparent text-slate-500 transition-all hover:border-slate-500 hover:text-slate-300 text-center">pending</button>
          <button type="button" data-if-chip="running"
                  data-if-active="bg-orange-950 text-orange-300 border-orange-700"
                  data-if-inactive="bg-transparent text-slate-500 border-slate-700"
                  onclick="toggleIfStatus('running')"
                  class="if-chip py-1.5 rounded-md text-xs font-medium cursor-pointer border border-slate-700 bg-transparent text-slate-500 transition-all hover:border-slate-500 hover:text-slate-300 text-center">running</button>
          <button type="button" data-if-chip="completed"
                  data-if-active="bg-emerald-950 text-emerald-300 border-emerald-700"
                  data-if-inactive="bg-transparent text-slate-500 border-slate-700"
                  onclick="toggleIfStatus('completed')"
                  class="if-chip py-1.5 rounded-md text-xs font-medium cursor-pointer border border-slate-700 bg-transparent text-slate-500 transition-all hover:border-slate-500 hover:text-slate-300 text-center">completed</button>
          <button type="button" data-if-chip="failed"
                  data-if-active="bg-red-950 text-red-300 border-red-700"
                  data-if-inactive="bg-transparent text-slate-500 border-slate-700"
                  onclick="toggleIfStatus('failed')"
                  class="if-chip py-1.5 rounded-md text-xs font-medium cursor-pointer border border-slate-700 bg-transparent text-slate-500 transition-all hover:border-slate-500 hover:text-slate-300 text-center">failed</button>
        </div>
      </div>
      <div id="instances-list"
           class="overflow-y-auto flex-1"
           hx-get="/ui/instances"
           hx-include="#instances-filter"
           hx-trigger="load, every 5s, refreshInstances from:body"
           hx-target="#instances-list"
           hx-swap="innerHTML">
      </div>

    </aside>

    <main id="detail" class="flex-1 overflow-y-auto"></main>

  </div>

  <script>
    (function () {
      window.toggleIfStatus = function (val) {
        var inp = document.getElementById('if-status');
        var statuses = inp.value ? inp.value.split(',') : [];
        var idx = statuses.indexOf(val);
        if (idx === -1) statuses.push(val);
        else statuses.splice(idx, 1);
        inp.value = statuses.join(',');

        document.querySelectorAll('[data-if-chip]').forEach(function (btn) {
          var on = statuses.indexOf(btn.dataset.ifChip) !== -1;
          (btn.dataset.ifActive   || '').split(' ').forEach(function (c) { btn.classList.toggle(c, on); });
          (btn.dataset.ifInactive || '').split(' ').forEach(function (c) { btn.classList.toggle(c, !on); });
        });

        // Fire the instances list refresh; hx-include picks up the updated hidden input.
        htmx.trigger(document.body, 'refreshInstances');
      };
    }());

    (function () {
      // true only during the initial page load; prevents a spurious pushState entry.
      var initialLoad = true;

      function pathFromHash() {
        var h = window.location.hash.slice(1);
        return h ? '/ui/' + h : '/ui/runs';
      }

      // After each GET swap into #detail, keep the URL hash in sync with the view.
      // Initial load: replaceState (normalize URL, no extra history entry).
      // Subsequent navigation: pushState so back/forward buttons work.
      document.body.addEventListener('htmx:afterSettle', function (evt) {
        if (!evt.detail.target || evt.detail.target.id !== 'detail') return;
        var cfg = evt.detail.requestConfig;
        if (!cfg || cfg.verb !== 'get') return;
        var path = cfg.path;
        if (!path && evt.detail.xhr) {
          try { path = new URL(evt.detail.xhr.responseURL).pathname; } catch (e) {}
        }
        if (path && path.startsWith('/ui/')) {
          var newHash = '#' + path.slice(4);
          if (initialLoad) {
            history.replaceState(null, '', newHash);
            initialLoad = false;
          } else if (window.location.hash !== newHash) {
            history.pushState(null, '', newHash);
          }
        }
      });

      // Browser back / forward support.
      window.addEventListener('popstate', function () {
        htmx.ajax('GET', pathFromHash(), { target: '#detail', swap: 'innerHTML' });
      });

      // Restore the last view from the hash on initial load, defaulting to runs.
      document.addEventListener('DOMContentLoaded', function () {
        htmx.ajax('GET', pathFromHash(), { target: '#detail', swap: 'innerHTML' });
      });
    }());
  </script>
</body>
</html>
