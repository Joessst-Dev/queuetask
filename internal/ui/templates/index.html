<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>queuetask</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --surface2: #334155;
      --border:   #334155;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      --blue:     #3b82f6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

    /* ── header ── */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.04em; }

    /* ── two-column layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    aside {
      width: 300px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-title {
      padding: 10px 16px; font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #instances-list { overflow-y: auto; flex: 1; }

    main { flex: 1; overflow-y: auto; padding: 24px; }

    /* ── empty state ── */
    .empty { color: var(--muted); font-size: 0.875rem; padding: 16px; }

    /* ── status badge ── */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 99px;
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .badge.completed          { background: #052e16; color: #4ade80; }
    .badge.running            { background: #1c1917; color: #fb923c; }
    .badge.waiting_manual     { background: #1e1b4b; color: #818cf8; }
    .badge.waiting_queueti    { background: #0c4a6e; color: #38bdf8; }
    .badge.failed             { background: #450a0a; color: #f87171; }
    .badge.pending            { background: #1e293b; color: #64748b; }

    /* ── instance list items ── */
    .instance-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.1s;
    }
    .instance-item:hover { background: var(--surface2); }
    .instance-item:last-child { border-bottom: none; }
    .item-name  { font-size: 0.875rem; font-weight: 500; margin-bottom: 5px; }
    .item-meta  { display: flex; align-items: center; gap: 8px; }
    .item-id    { font-family: monospace; font-size: 0.7rem; color: var(--muted); }
    .item-time  { font-size: 0.7rem; color: var(--muted); margin-left: auto; }

    /* ── steps panel ── */
    .detail-header { margin-bottom: 20px; }
    .detail-title  { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .detail-id     { font-family: monospace; font-size: 0.75rem; color: var(--muted); }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    .step-name { font-weight: 500; }
    .step-order { color: var(--muted); font-size: 0.75rem; }

    .error-msg {
      margin-top: 6px; padding: 8px 10px;
      background: rgba(239,68,68,0.1); border-left: 3px solid #ef4444; border-radius: 0 4px 4px 0;
      color: #fca5a5; font-family: monospace; font-size: 0.78rem;
      white-space: pre-wrap; word-break: break-all;
    }

    .btn-trigger {
      padding: 5px 14px; background: var(--blue); color: #fff;
      border: none; border-radius: 5px; font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-trigger:hover { opacity: 0.85; }
    .btn-trigger.htmx-request { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    .error-box {
      padding: 16px; background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3); border-radius: 6px;
      color: #fca5a5; font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <h1>queuetask</h1>
  </header>

  <div class="layout">
    <aside>
      <div class="sidebar-title">Instances</div>
      <div id="instances-list"
           hx-get="/ui/instances"
           hx-trigger="load, every 5s"
           hx-target="#instances-list"
           hx-swap="innerHTML">
      </div>
    </aside>

    <main id="detail">
      <p class="empty">← Select an instance to view its steps.</p>
    </main>
  </div>
</body>
</html>
