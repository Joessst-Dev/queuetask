{{if not .}}
<p class="px-4 py-3 text-slate-500 text-sm">No workflows loaded.</p>
{{else}}
{{range .}}
<div class="px-4 py-3 border-b border-slate-800">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="text-sm font-medium text-slate-200 truncate">{{.Name}}</div>
      {{if .Triggers}}
      <div class="text-xs text-slate-500 mt-0.5">{{len .Triggers}} trigger{{if gt (len .Triggers) 1}}s{{end}}</div>
      {{end}}
    </div>
    <button class="btn-trigger shrink-0 mt-0.5 px-2 py-0.5 text-xs font-medium text-blue-400 hover:text-blue-300 border border-blue-400/30 hover:border-blue-400/60 hover:bg-blue-400/10 rounded transition-colors cursor-pointer bg-transparent"
            hx-post="/ui/workflows/{{.Name}}/start"
            hx-target="#detail"
            hx-swap="innerHTML">
      Start
    </button>
  </div>
</div>
{{end}}
{{end}}
