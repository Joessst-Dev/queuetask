{{if not .}}
<p class="px-4 py-3 text-slate-500 text-sm">No workflows loaded.</p>
{{else}}
{{range .}}
<div class="px-4 py-3 border-b border-slate-800 flex flex-col gap-2">
  <div class="text-sm font-medium text-slate-200 truncate">{{.Name}}</div>
  {{if .Triggers}}
  <div class="text-xs text-slate-500">{{len .Triggers}} trigger{{if gt (len .Triggers) 1}}s{{end}}</div>
  {{end}}
  <button class="btn-trigger px-3 py-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-medium rounded-md transition-colors cursor-pointer border-0 self-start"
          hx-post="/ui/workflows/{{.Name}}/start"
          hx-target="#detail"
          hx-swap="innerHTML">
    Start
  </button>
</div>
{{end}}
{{end}}
