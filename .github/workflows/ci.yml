name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # go.mod has replace directives pointing to ../queue-ti — clone it as a sibling.
      - name: Clone queue-ti dependency
        run: git clone https://github.com/Joessst-Dev/queue-ti.git ../queue-ti

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -timeout 300s -race
        env:
          # Disable Ryuk cleanup container — avoids Docker-in-Docker permission issues on CI.
          TESTCONTAINERS_RYUK_DISABLED: "true"
